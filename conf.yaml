# Echo 配置文件 —— 改配置即可切换模块，无需改代码
#
# 四个组件：VAD（听不听得到）→ ASR（听成什么字）→ LLM（怎么回复）→ TTS（怎么说话）
# 每个组件都有 "mock" 假实现，方便先跑通链路再换真后端。

vad_config:
  # 可选: "silero_vad"（真实现）, "mock_vad"（假实现）, "none"（禁用）
  vad_type: "silero_vad"

  silero:
    prob_threshold: 0.5
    db_threshold: -30.0       # 能量阈值（负值）：越低越灵敏；麦克风声音小就再调低（如 -40）
    required_hits: 5           # 连续命中 5 次确认开口（5×32ms≈0.16s），越大越不易被噪声误触发
    required_misses: 24        # 连续未命中 24 次确认说完（24×32ms≈0.77s）
    smoothing_window: 5        # 滑动窗口平滑
    pre_buffer_size: 20        # 预缓冲帧数（防切头）
    window_size_samples: 512   # silero-vad 每帧 512 采样点
    sample_rate: 16000         # 16k 对应 512 点/帧；8k 则必须是 256 点/帧
    db_margin: 6.0             # 说话至少比环境底噪高 6dB 才算（自适应，防风扇/空调误触发）
    db_adapt_limit: 10.0       # 自适应阈值最多抬高 10dB（防止噪声大时把门槛抬到听不见人声）
    # 说明：底噪由前 20 帧自动估计并持续跟踪。若说话时一直触发不了，
    #       先把 db_margin 调小（如 3.0），仍不行再降低 db_threshold（如 -35）。

asr_config:
  # 可选: "faster_whisper"（本地 Whisper）, "sherpa_onnx"（SenseVoice）, "mock_asr", "none"
  asr_type: "faster_whisper"

  faster_whisper:
    model_path: "small"          # 模型名（small）或本地路径
    download_root: "models/whisper"
    language: "zh"
    # "cpu" 最稳；"auto" 会在有 NVIDIA 显卡时选 CUDA，但需要装好 cuBLAS/cuDNN，
    # 否则推理时才报错（程序会自动回退 CPU，见 FALLBACK_CPU）
    device: "cpu"
    compute_type: "int8"
    prompt:                      # initial_prompt，留空 = 不加提示

  sherpa_onnx:
    model_path: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx"
    tokens: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt"
    num_threads: 4
    use_itn: true
    provider: "cpu"

llm_config:
  # 可选: "openai_compatible"（在线 API，当前默认）, "ollama"（本地模型）,
  #       "mock_llm"（假实现，只测链路）, "none"
  llm_type: "openai_compatible"

  system_prompt: "你是 Echo，一个中文语音助手。回复要口语化、简短，控制在两三句话内。"
  max_history_turns: 6           # 记住最近几轮对话

  ollama:
    model: "qwen2.5:3b"
    host: "http://127.0.0.1:11434"
    temperature: 0.7
    num_predict: 256
    timeout: 60

  openai_compatible:
    # 常用 OpenAI 兼容服务（换服务商只需改下面 base_url 与 model 两行）：
    #   DeepSeek   https://api.deepseek.com/v1                        deepseek-chat
    #   通义千问     https://dashscope.aliyuncs.com/compatible-mode/v1  qwen-plus
    #   智谱 GLM   https://open.bigmodel.cn/api/paas/v4               glm-4-flash
    #   月之暗面     https://api.moonshot.cn/v1                         moonshot-v1-8k
    #   硅基流动     https://api.siliconflow.cn/v1                      Qwen/Qwen2.5-7B-Instruct
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "ECHO_LLM_API_KEY"   # 密钥从环境变量读，不写进配置文件
    temperature: 0.7
    max_tokens: 256                   # 限制回复长度：口语场景够用，也省钱
    timeout: 60

tts_config:
  # 可选: "edge_tts"（在线，音质自然）, "mock_tts"（静音文件，测试用）, "none"
  tts_type: "edge_tts"
  output_dir: "outputs"

  edge_tts:
    voice: "zh-CN-XiaoxiaoNeural"   # 女声；男声可换 zh-CN-YunxiNeural
    rate: "+0%"
    volume: "+0%"

app_config:
  sample_rate: 16000
  block_size_samples: 512
  input_device:                     # 留空=系统默认麦克风；也可填设备编号（--mode mic 会打印）
  # 双工模式：
  #   half     —— 播放时暂停采集（外放安全，默认，推荐先用这个）
  #   barge_in —— 播放时继续听，用户开口即打断（需要耳机，否则会被自己的声音打断）
  #   full     —— 完全并发（需要回声消除 AEC，当前仅预留）
  duplex_mode: "half"
  min_utterance_seconds: 0.5        # 短于该时长的语音段丢弃（多半是噪声）
  max_utterance_seconds: 15.0       # 单句最长时长：超过强制切分，避免状态机卡死
  audio_idle_timeout: 1.0           # 说话中音频断流超过该秒数：强制收尾并重启采集
  history_file: "outputs/chat_history.json"
